name: Build and Release

on:
  push:
    branches:
      - main
      - development

jobs:
  build:
    # `os` is just the leg's identifier — the per-step `if:` guards below
    # compare against it — while `runner` carries the actual label set. It has to
    # be a JSON string because a matrix value can only be expanded into `runs-on`
    # as a scalar; fromJSON turns it back into the label array.
    runs-on: ${{ fromJSON(matrix.runner) }}
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      commit_message: ${{ steps.get_commit_message.outputs.commit_message }}
      is_development: ${{ steps.check_branch.outputs.is_development }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux-arm64, linux-x64, macos-arm64, windows-x64]
        include:
          # Must be an arm64 runner: `build:executable:linux` compiles for
          # whatever the runner is, and this binary runs on the Pi kiosk. The
          # x64 Linux runner would emit an x64 executable still named
          # …-linux-arm64, so this leg goes to the arm64 build box.
          - os: linux-arm64
            runner: '["self-hosted","Linux","ARM64"]'
            build_script: build:executable:linux
            artifact_name: station-cli-linux-arm64
          # This label set targets the x64 Linux runner in GitHub's Default
          # runner group. The Default group is used automatically when only
          # labels are specified.
          - os: linux-x64
            runner: '["self-hosted","Linux","X64"]'
            build_script: build:executable:linux-x64
            artifact_name: station-cli-linux-x64
          - os: macos-arm64
            runner: '["macos-latest"]'
            build_script: build:executable:macos
            artifact_name: station-cli-macos-arm64
          - os: windows-x64
            runner: '["self-hosted","Windows","X64"]'
            build_script: build:executable:windows
            artifact_name: station-cli-windows-x64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch
        id: check_branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/development" ]; then
            echo "is_development=true" >> $GITHUB_OUTPUT
          else
            echo "is_development=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # No actions/setup-python step for this leg: the arm64 builder is Debian 13,
      # and actions/python-versions publishes no arm64 asset for Debian 13, so
      # setup-python fails while resolving the version — it never gets as far as
      # running anything. Nothing here needs a *specific* Python either:
      # @serialport/bindings-cpp ships a linux-arm64 prebuild, so its
      # node-gyp-build install hook loads that and never shells out to node-gyp.
      # The distro python3 below is just insurance for the day a dependency
      # arrives without a matching prebuild and that fallback does fire.
      - name: Install dependencies (Linux)
        if: matrix.os == 'linux-arm64' || matrix.os == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++ git python3
          echo "npm_config_python=$(command -v python3)" >> "$GITHUB_ENV"
          npm ci

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-x64'
        run: |
          npm ci
        shell: bash

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-arm64'
        run: |
          npm ci
        shell: bash

      - name: Build executable
        run: npm run ${{ matrix.build_script }}
        shell: bash

      # Purely a handoff to the `release` job below, which downloads all four
      # legs and attaches them to the GitHub Release. The Release asset is the
      # deliverable — the kiosk's station_cli_service / auto-updater fetch
      # `releases/download/<tag>/<binary>`, never the Actions artifact API — so
      # this copy is dead weight the moment the release job finishes.
      #
      # `retention-days: 3` rather than the org default: three platform binaries
      # per push to main/development is ~57 MB a run, and at 90 days that was
      # 571 MB of the 2.57 GB the org had accumulated against a 500 MB Free-plan
      # allowance. Three days still leaves room to re-run a failed `release` job
      # the next morning without re-running the whole build.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: executables/${{ matrix.artifact_name }}
          if-no-files-found: error
          # Transport only: the release job republishes these as Release assets,
          # which are not charged to the org's storage quota. Artifacts are.
          retention-days: 1

      - name: Get version
        id: get_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Get commit message
        id: get_commit_message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "commit_message<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

  release:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Move artifacts to root directory
        run: |
          # List contents to debug
          ls -la station-cli-linux-arm64/
          ls -la station-cli-linux-x64/
          ls -la station-cli-macos-arm64/
          ls -la station-cli-windows-x64.exe/
          
          # The files are already in the correct location, just rename the directories
          mv station-cli-linux-arm64/station-cli-linux-arm64 ./station-cli-linux-arm64.tmp
          mv station-cli-linux-x64/station-cli-linux-x64 ./station-cli-linux-x64.tmp
          mv station-cli-macos-arm64/station-cli-macos-arm64 ./station-cli-macos-arm64.tmp
          mv station-cli-windows-x64.exe/station-cli-windows-x64.exe ./station-cli-windows-x64.exe.tmp
          
          # Clean up directories
          rm -rf station-cli-linux-arm64 station-cli-linux-x64 station-cli-macos-arm64 station-cli-windows-x64.exe
          
          # Rename the files to their final names
          mv station-cli-linux-arm64.tmp station-cli-linux-arm64
          mv station-cli-linux-x64.tmp station-cli-linux-x64
          mv station-cli-macos-arm64.tmp station-cli-macos-arm64
          mv station-cli-windows-x64.exe.tmp station-cli-windows-x64.exe
          
          # Make executables executable (not needed for Windows .exe)
          chmod +x station-cli-linux-arm64 station-cli-linux-x64 station-cli-macos-arm64
          
          # Verify the files exist and are executable
          ls -la station-cli-*

      - name: Generate metadata.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MIN_KIOSK=$(node -p "require('./package.json').minKioskAppVersion || '1.0.0'")
          printf '{\n  "cli_version": "%s",\n  "min_kiosk_app_version": "%s"\n}\n' "$VERSION" "$MIN_KIOSK" > metadata.json
          echo "Generated metadata.json:"
          cat metadata.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ needs.build.outputs.is_development == 'true' && format('Development Release v{0}', needs.build.outputs.version) || format('Release v{0}', needs.build.outputs.version) }}
          body: |
            ## What's Changed
            
            ${{ needs.build.outputs.commit_message }}
            
            ## Downloads
            
            ### Linux ARM64
            - [station-cli-linux-arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.is_development == 'true' && format('dev-v{0}', needs.build.outputs.version) || format('v{0}', needs.build.outputs.version) }}/station-cli-linux-arm64)

            ### Linux x64
            - [station-cli-linux-x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.is_development == 'true' && format('dev-v{0}', needs.build.outputs.version) || format('v{0}', needs.build.outputs.version) }}/station-cli-linux-x64)
            
            ### macOS
            - [station-cli-macos-arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.is_development == 'true' && format('dev-v{0}', needs.build.outputs.version) || format('v{0}', needs.build.outputs.version) }}/station-cli-macos-arm64)
            
            ### Windows x64
            - [station-cli-windows-x64.exe](https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.is_development == 'true' && format('dev-v{0}', needs.build.outputs.version) || format('v{0}', needs.build.outputs.version) }}/station-cli-windows-x64.exe)
          draft: false
          prerelease: ${{ needs.build.outputs.is_development == 'true' }}
          files: |
            station-cli-linux-arm64
            station-cli-linux-x64
            station-cli-macos-arm64
            station-cli-windows-x64.exe
            metadata.json 
          tag_name: ${{ needs.build.outputs.is_development == 'true' && format('dev-v{0}', needs.build.outputs.version) || format('v{0}', needs.build.outputs.version) }}
