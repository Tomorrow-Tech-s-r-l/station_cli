name: Build and Release

on:
  push:
    branches:
      - main
      - development

jobs:
  build:
    # `os` is just the leg's identifier — the per-step `if:` guards below
    # compare against it — while `runner` carries the actual label set. It has to
    # be a JSON string because a matrix value can only be expanded into `runs-on`
    # as a scalar; fromJSON turns it back into the label array.
    runs-on: ${{ fromJSON(matrix.runner) }}
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      commit_message: ${{ steps.get_commit_message.outputs.commit_message }}
      is_development: ${{ steps.check_branch.outputs.is_development }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux-arm64, linux-x64, macos-arm64, windows-x64]
        include:
          # Must be an arm64 runner: `build:executable:linux` compiles for
          # whatever the runner is, and this binary runs on the Pi kiosk. The
          # x64 Linux runner would emit an x64 executable still named
          # …-linux-arm64, so this leg goes to the arm64 build box.
          - os: linux-arm64
            runner: '["self-hosted","Linux","ARM64"]'
            build_script: build:executable:linux
            artifact_name: station-cli-linux-arm64
          # This label set targets the x64 Linux runner in GitHub's Default
          # runner group. The Default group is used automatically when only
          # labels are specified.
          - os: linux-x64
            runner: '["self-hosted","Linux","X64"]'
            build_script: build:executable:linux-x64
            artifact_name: station-cli-linux-x64
          - os: macos-arm64
            runner: '["macos-latest"]'
            build_script: build:executable:macos
            artifact_name: station-cli-macos-arm64
          - os: windows-x64
            runner: '["self-hosted","Windows","X64"]'
            build_script: build:executable:windows
            artifact_name: station-cli-windows-x64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch
        id: check_branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/development" ]; then
            echo "is_development=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_development=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # No actions/setup-python step for this leg: the arm64 builder is Debian 13,
      # and actions/python-versions publishes no arm64 asset for Debian 13, so
      # setup-python fails while resolving the version — it never gets as far as
      # running anything. Nothing here needs a *specific* Python either:
      # @serialport/bindings-cpp ships a linux-arm64 prebuild, so its
      # node-gyp-build install hook loads that and never shells out to node-gyp.
      # The distro python3 below is just insurance for the day a dependency
      # arrives without a matching prebuild and that fallback does fire.
      - name: Install dependencies (Linux ARM64)
        if: matrix.os == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++ git python3
          echo "npm_config_python=$(command -v python3)" >> "$GITHUB_ENV"
          npm ci

      # The x64 self-hosted runner does not grant its Actions user passwordless
      # sudo. `pkg` and serialport use their Linux x64 prebuilds, so Node's
      # setup is sufficient here and no system package installation is needed.
      - name: Install dependencies (Linux x64)
        if: matrix.os == 'linux-x64'
        run: npm ci

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-x64'
        run: |
          npm ci
        shell: bash

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-arm64'
        run: |
          npm ci
        shell: bash

      # Before the executable build so a logic regression fails as its own red
      # step on every platform leg. `npm run build` also runs `npm test` first,
      # so the gate holds even if this step is ever removed.
      - name: Run logic tests
        run: npm test
        shell: bash

      # The firmware-update and config tests (tests/*.test.js), on the Linux
      # leg. They need no hardware — they drive in-memory fake devices through
      # the real firmware-update code. A failure fails this leg, and the
      # release job below needs every leg, so nothing ships.
      # Also re-checks that no workflow exposes a self-hosted runner to a
      # fork-controllable trigger (see CONTRIBUTING.md).
      - name: Test (Linux x64)
        if: matrix.os == 'linux-x64'
        run: |
          node scripts/check-workflows.js
          npm run test:unit
        shell: bash

      # bundle/ is packed into the executable (package.json pkg.assets): the
      # release tag this build becomes — a version alone cannot tell v0.5.0
      # from dev-v0.5.0, and compatibility.json may treat them differently —
      # and the published compatibility.json, the copy the CLI falls back to
      # when it can neither download nor find a cached one. Downloaded, never
      # written by hand; without COMPAT_TOKEN the build simply carries none.
      - name: Bundle build info and compatibility.json
        env:
          COMPAT_TOKEN: ${{ secrets.COMPAT_TOKEN }}
          IS_DEV: ${{ steps.check_branch.outputs.is_development }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$IS_DEV" = "true" ]; then TAG="dev-v$VERSION"; else TAG="v$VERSION"; fi
          node scripts/bundle.js --tag "$TAG" --commit "$GITHUB_SHA"
        shell: bash

      - name: Build executable
        run: npm run ${{ matrix.build_script }}
        shell: bash

      # Purely a handoff to the `release` job below, which downloads all four
      # legs and attaches them to the GitHub Release. The Release asset is the
      # deliverable — the kiosk's station_cli_service / auto-updater fetch
      # `releases/download/<tag>/<binary>`, never the Actions artifact API — so
      # this copy is dead weight the moment the release job finishes.
      #
      # `retention-days: 3` rather than the org default: three platform binaries
      # per push to main/development is ~57 MB a run, and at 90 days that was
      # 571 MB of the 2.57 GB the org had accumulated against a 500 MB Free-plan
      # allowance. Three days still leaves room to re-run a failed `release` job
      # the next morning without re-running the whole build.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: executables/${{ matrix.artifact_name }}
          if-no-files-found: error
          # Transport only: the release gate (station_emulator downloads the
          # linux-arm64 one from this run) and the release job, which republishes
          # them as Release assets — not charged to the org's storage quota.
          retention-days: 1

      - name: Get version
        id: get_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Get commit message
        id: get_commit_message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          {
            echo "commit_message<<EOF"
            echo "$COMMIT_MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        shell: bash

  # Release gate for the firmware engine: THIS build's fw-status / fw-plan /
  # fw-apply flash an emulated station (boards + packs down to their
  # bootloaders) with the current firmware releases — happy path, power loss
  # and recovery, lost acks, CRC failures, version verification, quarantine,
  # the per-run cap, channels and the exact report the kiosk parses.
  #
  # station_emulator is private and this repository is public, so its
  # reusable workflow cannot be called from here: the job checks the harness
  # out with RELEASE_TOKEN instead. Push-only, like every job in this file.
  fwu-e2e:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Token available?
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning::RELEASE_TOKEN is not set — skipping the firmware OTA e2e (it needs read access to station_emulator and the firmware releases)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build this CLI
        if: steps.token.outputs.ok == 'true'
        run: npm ci && npm run build

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          repository: Tomorrow-Tech-s-r-l/station_emulator
          ref: main
          path: station_emulator
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: dart-lang/setup-dart@v1
        if: steps.token.outputs.ok == 'true'

      - name: Emulator dependencies
        if: steps.token.outputs.ok == 'true'
        working-directory: station_emulator
        env:
          TT_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          cat > pubspec_overrides.yaml <<EOF
          dependency_overrides:
            tomorrowtech_station:
              git:
                url: https://x-access-token:${TT_TOKEN}@github.com/Tomorrow-Tech-s-r-l/tomorrowtech_station.git
                ref: main
          EOF
          dart pub get

      - name: Firmware images (current releases)
        if: steps.token.outputs.ok == 'true'
        working-directory: station_emulator
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CLI_CMD: node ${{ github.workspace }}/dist/cli.js
          BOARD_CHANNEL: ${{ github.ref_name == 'development' && 'development' || 'main' }}
          PACK_CHANNEL: ${{ github.ref_name == 'development' && 'development' || 'main' }}
          OUT_DIR: ${{ runner.temp }}/fwu-inputs
        # pipefail: without it the step is green when the resolver fails.
        run: |
          set -o pipefail
          tool/fwu_ci_resolve.sh | tee -a "$GITHUB_ENV"

      - name: Firmware OTA e2e
        if: steps.token.outputs.ok == 'true'
        working-directory: station_emulator
        run: |
          dart run tool/fwu_e2e.dart \
            --cli="$FWU_CLI" \
            --board-image="$FWU_BOARD_IMAGE" \
            --pack-image="$FWU_PACK_IMAGE" \
            --report=fwu-report/report.json \
            --logs=fwu-report \
            --summary="$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always() && steps.token.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fwu-e2e-report
          path: station_emulator/fwu-report/
          retention-days: 14
          if-no-files-found: ignore
          
  # Release gate for the whole product flow: THIS build's linux-arm64 binary
  # becomes the station_cli the real kiosk execs, on emulated station hardware,
  # against the real cloud — the full all-real e2e (rent → return, jammed
  # unlock, return elsewhere, double rent, config sync, OTA). It runs in
  # station_emulator (release-gate.yml, which downloads the candidate from this
  # run): development → amperry-dev with the development kiosk; main →
  # amperry-dev, then production, with the stable kiosk. Push-only. It only
  # waits, so it runs on a GitHub-hosted runner (free for this public repo)
  # rather than holding the single self-hosted X64 box for the whole gate.
  # Needs E2E_GATE_TOKEN: a PAT with actions:write + contents:read on
  # Tomorrow-Tech-s-r-l/station_emulator.
  gate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Run the station emulator release gate
        env:
          GH_TOKEN: ${{ secrets.E2E_GATE_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          IS_DEV: ${{ needs.build.outputs.is_development }}
        run: |
          set -euo pipefail
          gh api repos/Tomorrow-Tech-s-r-l/station_emulator/contents/tool/release_gate.sh \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/release_gate.sh"
          if [ "$IS_DEV" = "true" ]; then
            CHANNEL=development CLOUDS=amperry-dev TAG="dev-v$VERSION"
          else
            CHANNEL=main CLOUDS=amperry-dev,amperry-app TAG="v$VERSION"
          fi
          bash "$RUNNER_TEMP/release_gate.sh" --component=cli --version="$TAG" \
            --artifact=station-cli-linux-arm64 --channel="$CHANNEL" --clouds="$CLOUDS" --tests=all
  # Release gate for the station commands: the linux-x64 executable this
  # build just made, against the station firmware's protocol code
  # (development, main, the newest release and dev release) — every command
  # the kiosk app uses, down to the values in the JSON. See
  # firmware_contract.yml; its table goes into the release notes.
  fw-contract:
    needs: build
    uses: ./.github/workflows/firmware_contract.yml
    with:
      cli_artifact: station-cli-linux-x64
      cli_tag: ${{ needs.build.outputs.is_development == 'true' && format('dev-v{0}', needs.build.outputs.version) || format('v{0}', needs.build.outputs.version) }}
    secrets: inherit

  # Never released past a red gate: every gate below is required.
  release:
    needs: [build, fwu-e2e, fw-contract, gate]
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Move artifacts to root directory
        run: |
          # List contents to debug
          ls -la station-cli-linux-arm64/
          ls -la station-cli-linux-x64/
          ls -la station-cli-macos-arm64/
          ls -la station-cli-windows-x64.exe/
          
          # The files are already in the correct location, just rename the directories
          mv station-cli-linux-arm64/station-cli-linux-arm64 ./station-cli-linux-arm64.tmp
          mv station-cli-linux-x64/station-cli-linux-x64 ./station-cli-linux-x64.tmp
          mv station-cli-macos-arm64/station-cli-macos-arm64 ./station-cli-macos-arm64.tmp
          mv station-cli-windows-x64.exe/station-cli-windows-x64.exe ./station-cli-windows-x64.exe.tmp
          
          # Clean up directories
          rm -rf station-cli-linux-arm64 station-cli-linux-x64 station-cli-macos-arm64 station-cli-windows-x64.exe
          
          # Rename the files to their final names
          mv station-cli-linux-arm64.tmp station-cli-linux-arm64
          mv station-cli-linux-x64.tmp station-cli-linux-x64
          mv station-cli-macos-arm64.tmp station-cli-macos-arm64
          mv station-cli-windows-x64.exe.tmp station-cli-windows-x64.exe
          
          # Make executables executable (not needed for Windows .exe)
          chmod +x station-cli-linux-arm64 station-cli-linux-x64 station-cli-macos-arm64
          
          # Verify the files exist and are executable
          ls -la station-cli-*

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: release-compatibility-cli available?
        id: compat
        env:
          COMPAT_TOKEN: ${{ secrets.COMPAT_TOKEN }}
          COMPAT_REF: ${{ vars.COMPAT_REF }}
        run: |
          if [ -n "$COMPAT_TOKEN" ] && [ -n "$COMPAT_REF" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::COMPAT_TOKEN or vars.COMPAT_REF not set — metadata.json gets no computed floors; a legacy field is carried only from a previous release that computed it, else the release fails"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.compat.outputs.ok == 'true'
        with:
          repository: Tomorrow-Tech-s-r-l/release-compatibility-cli
          ref: ${{ vars.COMPAT_REF }}
          path: release-compatibility-cli
          token: ${{ secrets.COMPAT_TOKEN }}

      # metadata.json, schema 2, computed — never declared. The floors come
      # from this run's contract evidence (fw-contract → artifact
      # compat-evidence-unpublished) through release-compatibility-cli (`compat floor`),
      # and for what this run did not test (the kiosk) from the published
      # compatibility.json (`compat metadata`). The legacy
      # min_kiosk_app_version, which kiosks in the field read, uses the floor
      # of this release's channel (a production release: the floor over
      # production kiosks): its X.Y.Z, one patch above the newest kiosk
      # tested when none is compatible, and with no evidence a value carried
      # from something computed, listed in computed.carried_forward /
      # carried_from: first the published compatibility.json (`compat fetch`,
      # passed as `--carry-compat`: the floor of this channel of the newest
      # earlier station_cli release in it backed by evidence — so the first
      # release after schema-1 metadata.json still computes its floor), then
      # the newest earlier release whose metadata.json was itself computed
      # (schema 2 with a run_url). The kiosk's nightly kiosk_cli_contract
      # targets the newest CLI tags of both channels, so the next
      # compatibility.json computes this tag's kiosk floor from evidence.
      # Nothing computed to carry: the step fails, and so does the release
      # (release-metadata.js). Kiosks already in the field read
      # min_kiosk_app_version, so it never ends up higher than what this tag
      # (when it is published again) or else the newest earlier release
      # published (any schema, same channel first) unless a
      # tested kiosk failure at or above that value proves it: kept otherwise
      # (computed.legacy_clamped, a notice), raised loudly when proven
      # (computed.legacy_raised, a warning and a line in the job summary).
      # `capabilities` is what the released binary itself reports.
      - name: Compute metadata.json
        env:
          GH_TOKEN: ${{ github.token }}
          COMPAT_TOKEN: ${{ secrets.COMPAT_TOKEN }}
          COMPAT: ${{ steps.compat.outputs.ok }}
          VERSION: ${{ needs.build.outputs.version }}
          IS_DEV: ${{ needs.build.outputs.is_development }}
        run: |
          set -euo pipefail
          if [ "$IS_DEV" = "true" ]; then TAG="dev-v$VERSION"; else TAG="v$VERSION"; fi
          W="$RUNNER_TEMP/metadata" && rm -rf "$W" && mkdir -p "$W"
          ./station-cli-linux-x64 capabilities --json > "$W/capabilities.json"

          # The newest earlier release with a computed metadata.json (same
          # channel first); else the newest one with any, which
          # release-metadata.js then refuses to carry from, saying why. The
          # newest one with any metadata.json is also what deployed kiosks
          # saw last: the value a legacy floor is held to (--published).
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | node scripts/release-metadata.js previous-tags "$TAG" | head -n 10 > "$W/previous-tags.txt" || true
          PUBLISHED_TAG=""
          # A tag published again (a rebuilt release) was last seen by
          # deployed kiosks with its own metadata.json: hold to that one.
          if gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p metadata.json -D "$W/self" 2>/dev/null; then
            PUBLISHED_TAG="$TAG"
            mkdir -p "$W/published" && cp "$W/self/metadata.json" "$W/published/metadata.json"
          fi
          while read -r prev; do
            rm -rf "$W/candidate"
            gh release download "$prev" -R "$GITHUB_REPOSITORY" -p metadata.json -D "$W/candidate" 2>/dev/null || continue
            if [ -z "$PUBLISHED_TAG" ]; then
              PUBLISHED_TAG="$prev"
              mkdir -p "$W/published" && cp "$W/candidate/metadata.json" "$W/published/metadata.json"
            fi
            if node scripts/release-metadata.js has-provenance "$W/candidate/metadata.json"; then
              rm -rf "$W/previous" && mv "$W/candidate" "$W/previous"
              echo "::notice::legacy values may be carried from $prev"
              break
            fi
            [ -d "$W/previous" ] || mv "$W/candidate" "$W/previous"
          done < "$W/previous-tags.txt"

          args=()
          # fw-contract's evidence, uploaded as unpublished until this job
          # has published the tag (see firmware_contract.yml).
          EVIDENCE=compat-evidence-unpublished/evidence.json
          if [ "$COMPAT" = "true" ]; then
            ev_args=()
            if [ -f "$EVIDENCE" ]; then
              ev_args=(--evidence "$EVIDENCE")
              if node release-compatibility-cli/bin/compat.mjs floor --evidence "$EVIDENCE" --component station_cli --tag "$TAG" > "$W/floor.json"; then
                args+=(--floor "$W/floor.json")
              else
                echo "::warning::compat floor failed — metadata.json carries no computed floors"
              fi
            fi
            prev_args=()
            [ -f "$W/previous/metadata.json" ] && prev_args=(--previous "$W/previous/metadata.json")
            # The published compatibility.json (COMPAT_TOKEN): the floors of
            # what this run did not test, and the carry source of a legacy
            # field with no evidence for this tag.
            mkdir -p "$W/compat"
            if node release-compatibility-cli/bin/compat.mjs fetch --out "$W/compat/compatibility.json" \
              && node release-compatibility-cli/bin/compat.mjs metadata --component station_cli --tag "$TAG" \
                   --compat "$W/compat/compatibility.json" --carry-compat "$W/compat/compatibility.json" \
                   "${ev_args[@]}" "${prev_args[@]}" --out "$W/base.json"; then
              args+=(--base "$W/base.json")
            else
              echo "::warning::compat fetch/metadata failed — metadata.json is completed from the evidence floor alone"
            fi
          fi
          [ -f "$W/previous/metadata.json" ] && args+=(--previous "$W/previous/metadata.json")
          [ -n "$PUBLISHED_TAG" ] && args+=(--published "$W/published/metadata.json" --published-tag "$PUBLISHED_TAG")

          node scripts/release-metadata.js --tag "$TAG" --version "$VERSION" --out metadata.json \
            --capabilities "$W/capabilities.json" "${args[@]}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --suite-ref "$GITHUB_SHA"

      - name: Create Release
        # v2: v1 runs on the retired node16 runtime.
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.build.outputs.is_development == 'true' && format('Development Release v{0}', needs.build.outputs.version) || format('Release v{0}', needs.build.outputs.version) }}
          body: |
            ## What's Changed
            
            ${{ needs.build.outputs.commit_message }}
            
            ## Downloads
            
            ### Linux ARM64
            - [station-cli-linux-arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.is_development == 'true' && format('dev-v{0}', needs.build.outputs.version) || format('v{0}', needs.build.outputs.version) }}/station-cli-linux-arm64)

            ### Linux x64
            - [station-cli-linux-x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.is_development == 'true' && format('dev-v{0}', needs.build.outputs.version) || format('v{0}', needs.build.outputs.version) }}/station-cli-linux-x64)
            
            ### macOS
            - [station-cli-macos-arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.is_development == 'true' && format('dev-v{0}', needs.build.outputs.version) || format('v{0}', needs.build.outputs.version) }}/station-cli-macos-arm64)
            
            ### Windows x64
            - [station-cli-windows-x64.exe](https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.is_development == 'true' && format('dev-v{0}', needs.build.outputs.version) || format('v{0}', needs.build.outputs.version) }}/station-cli-windows-x64.exe)

            ## Tested with S1TTXX-firmware

            ${{ needs.fw-contract.outputs.report }}
          draft: false
          prerelease: ${{ needs.build.outputs.is_development == 'true' }}
          files: |
            station-cli-linux-arm64
            station-cli-linux-x64
            station-cli-macos-arm64
            station-cli-windows-x64.exe
            metadata.json
          tag_name: ${{ needs.build.outputs.is_development == 'true' && format('dev-v{0}', needs.build.outputs.version) || format('v{0}', needs.build.outputs.version) }}
          target_commitish: ${{ github.sha }}

      # The release exists now, so the contract evidence of this run can move
      # floors: publish it under the name release-compatibility-cli ingests, and hand it
      # over, so compatibility.json is recomputed. Only from main /
      # development (the only branches this workflow runs on; guarded anyway,
      # as release-compatibility-cli trusts nothing else).
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        with:
          name: compat-evidence
          path: compat-evidence-unpublished/evidence.json
          retention-days: 30
          if-no-files-found: warn

      - name: Report the contract evidence to release-compatibility-cli
        if: steps.compat.outputs.ok == 'true' && hashFiles('compat-evidence-unpublished/evidence.json') != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
        env:
          GH_TOKEN: ${{ secrets.COMPAT_TOKEN }}
        run: |
          gh api repos/Tomorrow-Tech-s-r-l/release-compatibility-cli/dispatches -f event_type=compat-evidence \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" -f "client_payload[run_id]=$GITHUB_RUN_ID" \
            && echo "::notice::evidence of run $GITHUB_RUN_ID sent to release-compatibility-cli" \
            || echo "::warning::could not notify release-compatibility-cli (COMPAT_TOKEN needs contents:write there); dispatch firmware_contract.yml with cli_tag to report it again"

      # The other direction: S1TTXX-firmware re-runs its station-cli contract
      # with the executable just published, on its development and main.
      # Best effort: the nightly runs in both repositories cover a token
      # without actions:write on S1TTXX-firmware.
      - name: Re-test S1TTXX-firmware with this release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TARGET: ${{ needs.build.outputs.is_development == 'true' && 'dev-release' || 'release' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::RELEASE_TOKEN not set — S1TTXX-firmware will pick this release up in its nightly contract run"; exit 0; fi
          for ref in development main; do
            gh workflow run cli_contract.yml --repo Tomorrow-Tech-s-r-l/S1TTXX-firmware --ref "$ref" \
              -f cli_targets="[\"$TARGET\"]" -f fw_refs='["self", "release", "dev-release"]' \
              && echo "::notice::S1TTXX-firmware@$ref: station-cli contract re-run requested" \
              || echo "::warning::could not start S1TTXX-firmware@$ref cli_contract.yml (token needs actions:write there); the nightly run covers it"
          done
