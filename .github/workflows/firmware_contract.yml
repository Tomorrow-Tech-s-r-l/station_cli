name: Firmware contract

# The station_cli <-> firmware command contract, from this side: THIS CLI
# against the station firmware's protocol code, with a powerbank built from
# the pack firmware docked in the simulated station — every command the kiosk
# app uses in production, plus the diagnostics and the testing modes, down to
# the values in the JSON. The harness lives in S1TTXX-firmware
# (tests/cli_contract: a simulated station built from the firmware's own
# host_protocol.c / protocol_utils.c / pb_protocol.c); the firmware runs the
# same harness the other way round (its cli_contract.yml).
#
# Which firmware is tested is not written here: release-compat's
# `compat targets` names the releases (newest per channel, plus what the
# current floors depend on), and the legs are those × the development and
# main branches, for S1TTXX × P1TT2C. Every leg's result goes into
# `compat-evidence/v1` (artifact `compat-evidence`), from which release-compat
# computes the floors in compatibility.json and in this CLI's metadata.json.
# A branch on either side gates CI but never moves a floor.
#
# When:
#   - every push to a feature branch (this CLI built from source);
#   - main / development: called from build.yml with the linux-x64 executable
#     that build just made, and the release waits for it (build.yml reports
#     the evidence once the release exists);
#   - nightly, so a firmware change that breaks this CLI is reported on a day
#     nothing is pushed here;
#   - on request (cli_tag: a published release of this CLI, whose evidence is
#     then sent to release-compat).
#
# Without COMPAT_TOKEN / vars.COMPAT_REF it falls back to the legacy legs
# (development, main, newest release, newest dev release) and the harness's
# own pack, and reports no evidence.
#
# Push, schedule and dispatch only (never pull_request): it runs on
# self-hosted runners, see CONTRIBUTING.md.
on:
  push:
    branches-ignore: [main, development]
  workflow_call:
    inputs:
      cli_artifact:
        description: "Artifact of this run holding the station-cli-linux-x64 executable (empty: build from source)"
        required: false
        type: string
        default: ''
      cli_tag:
        description: "Release tag the CLI under test is (or will be) published as; empty for a branch build"
        required: false
        type: string
        default: ''
      fw_refs:
        description: "JSON list of firmware refs; empty: the releases compat targets names, plus development and main"
        required: false
        type: string
        default: ''
    outputs:
      report:
        description: "Markdown table of every pair tested"
        value: ${{ jobs.report.outputs.report }}
  workflow_dispatch:
    inputs:
      fw_refs:
        description: "JSON list of firmware refs (development, main, release, dev-release, or a tag); empty: compat targets"
        required: false
        type: string
        default: ''
      cli_tag:
        description: "Test this published station_cli release instead of the branch, and report the evidence"
        required: false
        type: string
        default: ''
      newest:
        description: "Station firmware releases per channel to test (compat targets --newest)"
        required: false
        type: string
        default: '3'
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: read

env:
  FW_REPO: Tomorrow-Tech-s-r-l/S1TTXX-firmware
  PACK_REPO: Tomorrow-Tech-s-r-l/P1TT2C-firmware
  COMPAT_REPO: Tomorrow-Tech-s-r-l/release-compat
  # The harness is versioned with the firmware; development has the newest
  # checks. An old firmware tree it cannot build is reported as not tested.
  HARNESS_REF: ${{ vars.CONTRACT_HARNESS_REF || 'development' }}

jobs:
  targets:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      compat: ${{ steps.compat.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: cli
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: release-compat available?
        id: compat
        env:
          COMPAT_TOKEN: ${{ secrets.COMPAT_TOKEN }}
          COMPAT_REF: ${{ vars.COMPAT_REF }}
        run: |
          if [ -n "$COMPAT_TOKEN" ] && [ -n "$COMPAT_REF" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::COMPAT_TOKEN or vars.COMPAT_REF not set — testing the legacy firmware legs, and reporting no compatibility evidence"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned by SHA (vars.COMPAT_REF): the tool that decides what is tested
      # changes only when this repository says so.
      - uses: actions/checkout@v4
        if: steps.compat.outputs.ok == 'true'
        with:
          repository: ${{ env.COMPAT_REPO }}
          ref: ${{ vars.COMPAT_REF }}
          path: release-compat
          token: ${{ secrets.COMPAT_TOKEN }}

      - name: Matrix
        id: matrix
        env:
          GH_TOKEN: ${{ secrets.COMPAT_TOKEN }}
          COMPAT_TOKEN: ${{ secrets.COMPAT_TOKEN }}
          COMPAT: ${{ steps.compat.outputs.ok }}
          FW_REFS: ${{ inputs.fw_refs }}
          NEWEST: ${{ inputs.newest || '3' }}
        run: |
          set -euo pipefail
          args=()
          if [ "$COMPAT" = "true" ] && [ -z "$FW_REFS" ]; then
            node release-compat/bin/compat.mjs targets --component S1TTXX --newest "$NEWEST" > "$RUNNER_TEMP/fw-targets.json"
            node release-compat/bin/compat.mjs targets --component P1TT2C --newest 1 > "$RUNNER_TEMP/pack-targets.json"
            args+=(--fw-targets "$RUNNER_TEMP/fw-targets.json" --pack-targets "$RUNNER_TEMP/pack-targets.json")
          fi
          matrix=$(node cli/scripts/contract-targets.js "${args[@]}" --fw-refs "$FW_REFS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  contract:
    name: fw ${{ matrix.fw }} × pack ${{ matrix.pack }}
    needs: targets
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      LEG: station-cli ${{ inputs.cli_tag || github.ref_name }} × fw ${{ matrix.fw }} × pack ${{ matrix.pack }}
    steps:
      # (the runner context is not available in a job's env)
      - name: Work folders
        run: |
          echo "OUT=$RUNNER_TEMP/fw-contract" >> "$GITHUB_ENV"
          echo "REPORTS=$RUNNER_TEMP/fw-contract/reports" >> "$GITHUB_ENV"
          rm -rf "$RUNNER_TEMP/fw-contract" && mkdir -p "$RUNNER_TEMP/fw-contract/reports"

      - name: Token available?
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning::RELEASE_TOKEN is not set — skipping the firmware contract (it needs read access to S1TTXX-firmware and P1TT2C-firmware)"
            echo "$LEG: not tested (RELEASE_TOKEN not set)" > "$REPORTS/leg.skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          path: cli

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          repository: ${{ env.FW_REPO }}
          ref: ${{ env.HARNESS_REF }}
          path: harness
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: '22'

      - name: Resolve the firmware
        id: fw
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FW: ${{ matrix.fw_ref }}
          FW_TAG: ${{ matrix.fw_tag }}
        run: |
          skip=""
          tag="$FW_TAG"
          # A harness from before release.js cannot test release pairs or
          # other firmware trees: say so instead of failing on it.
          if [ ! -f harness/tests/cli_contract/release.js ]; then
            skip="S1TTXX-firmware@$HARNESS_REF has an older contract harness; it runs here once that branch has tests/cli_contract/release.js"
            echo "::warning::$skip"
            echo "$LEG: not tested ($skip)" > "$REPORTS/leg.skipped"
            echo "skip=$skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$tag" ]; then
            ref="$tag"; label="$tag"
          else
            case "$FW" in
              main|development) ref="$FW"; label="$FW" ;;
              # legacy selectors (no release-compat) and tags from fw_refs
              *) ref=$(node harness/tests/cli_contract/release.js tag "$FW_REPO" "$FW")
                 tag="$ref"; label="$FW $ref"
                 [ -n "$ref" ] || skip="no firmware $FW release" ;;
            esac
          fi
          { echo "ref=$ref"; echo "tag=$tag"; echo "label=$label"; echo "skip=$skip"; } | tee -a "$GITHUB_OUTPUT"
          if [ -n "$skip" ]; then
            echo "::notice::$LEG not tested: $skip"
            echo "$LEG: not tested ($skip)" > "$REPORTS/leg.skipped"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true' && steps.fw.outputs.skip == ''
        with:
          repository: ${{ env.FW_REPO }}
          ref: ${{ steps.fw.outputs.ref }}
          path: fw
          token: ${{ secrets.RELEASE_TOKEN }}

      # The pack the simulated station docks: the P1TT2C tree at this leg's
      # ref. A harness that cannot build packs from a P1TT2C tree yet ignores
      # it, and the leg then records no pack context.
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true' && steps.fw.outputs.skip == '' && matrix.pack_ref != ''
        with:
          repository: ${{ env.PACK_REPO }}
          ref: ${{ matrix.pack_ref }}
          path: pack
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Pack under test
        id: pack
        if: steps.token.outputs.ok == 'true' && steps.fw.outputs.skip == ''
        run: |
          if [ -d pack ] && grep -q PACK_SRC harness/tests/cli_contract/*.sh; then
            { echo "used=true"; echo "ref=$(git -C pack rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"
          else
            [ -d pack ] && echo "::notice::harness@$HARNESS_REF does not build packs from a P1TT2C tree yet — its own pack is used"
            { echo "used=false"; echo "ref="; } >> "$GITHUB_OUTPUT"
          fi
          echo "fw_sha=$(git -C fw rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # main / development: the executable build.yml just made, the file the
      # release ships. A dispatch with cli_tag: that published release.
      # Elsewhere: this checkout, built by the harness.
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.ok == 'true' && steps.fw.outputs.skip == '' && inputs.cli_artifact != ''
        with:
          name: ${{ inputs.cli_artifact }}
          path: ${{ env.OUT }}/bin

      - name: Download the station_cli release under test
        if: steps.token.outputs.ok == 'true' && steps.fw.outputs.skip == '' && inputs.cli_artifact == '' && inputs.cli_tag != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CLI_TAG: ${{ inputs.cli_tag }}
        run: |
          mkdir -p "$OUT/bin"
          node harness/tests/cli_contract/release.js download "$GITHUB_REPOSITORY" "$CLI_TAG" station-cli-linux-x64 "$OUT/bin/station-cli-linux-x64"

      # Compiled in a container, statically and as the runner user, so it
      # needs no toolchain on the runner and leaves no root-owned files. A
      # release tree the harness cannot build is "not tested" (UNKNOWN in the
      # evidence), never a failure of this CLI; a branch that does not build is.
      - name: Build station_sim (firmware protocol code)
        id: sim
        if: steps.token.outputs.ok == 'true' && steps.fw.outputs.skip == ''
        env:
          PACK_USED: ${{ steps.pack.outputs.used }}
          FW_TAG: ${{ steps.fw.outputs.tag }}
        run: |
          pack_env=()
          [ "$PACK_USED" = "true" ] && pack_env=(-e PACK_SRC=/w/pack)
          for i in 1 2 3; do
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "${PWD}:/w:ro" -v "$OUT:/out" -w /w -e FW_SRC=/w/fw "${pack_env[@]}" gcc:13 \
              sh harness/tests/cli_contract/build_sim.sh /out/station_sim -static && exit 0
            echo "::warning::station_sim build attempt $i failed, retrying"
            sleep $((i * 15))
          done
          if [ -n "$FW_TAG" ]; then
            echo "::warning::the harness cannot build $FW_TAG — reported as not tested"
            echo "$LEG: not tested (harness cannot build $FW_TAG)" > "$REPORTS/leg.skipped"
            echo "skip=harness@$HARNESS_REF cannot build $FW_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit 1

      - name: Run this CLI's commands against the firmware
        if: steps.token.outputs.ok == 'true' && steps.fw.outputs.skip == '' && steps.sim.outputs.skip == ''
        env:
          STATION_SIM: ${{ env.OUT }}/station_sim
          FW_SRC: fw
          PACK_SRC: ${{ steps.pack.outputs.used == 'true' && 'pack' || '' }}
          CLI_ARTIFACT: ${{ inputs.cli_artifact }}
          CLI_TAG: ${{ inputs.cli_tag }}
          FW_LABEL: ${{ steps.fw.outputs.label }}
          PACK_LABEL: ${{ matrix.pack }}
        run: |
          if [ -f "$OUT/bin/station-cli-linux-x64" ]; then
            CLI="$OUT/bin/station-cli-linux-x64"
            CLI_LABEL="${CLI_TAG:-${GITHUB_REF_NAME} ${GITHUB_SHA:0:7}}, linux-x64 executable"
          else
            CLI=cli
            CLI_LABEL="${GITHUB_REF_NAME} ${GITHUB_SHA:0:7}"
          fi
          sh harness/tests/cli_contract/run.sh "$CLI" --label "$CLI_LABEL" --fw-label "$FW_LABEL × pack $PACK_LABEL" \
            --report "$REPORTS/leg.json" --summary "$GITHUB_STEP_SUMMARY"

      # A leg that died before the checks ran still shows up in the table.
      - name: Mark a leg without a report
        if: always() && steps.token.outputs.ok == 'true' && steps.fw.outputs.skip == '' && steps.sim.outputs.skip == ''
        run: |
          mkdir -p "$REPORTS"
          [ -f "$REPORTS/leg.json" ] || echo "$LEG ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" > "$REPORTS/leg.missing"

      # This leg as one compat-evidence result: ok (with its checks),
      # missing (died before reporting) or skipped (not tested).
      - name: Evidence
        if: always() && steps.token.outputs.ok == 'true'
        env:
          SKIP: ${{ steps.fw.outputs.skip || steps.sim.outputs.skip }}
          FW_TAG: ${{ steps.fw.outputs.tag }}
          FW_SHA: ${{ steps.pack.outputs.fw_sha }}
          CLI_TAG: ${{ inputs.cli_tag }}
          PACK_TAG: ${{ steps.pack.outputs.used == 'true' && matrix.pack_tag || '' }}
          PACK_SHA: ${{ steps.pack.outputs.ref }}
        run: |
          skipped=()
          [ -n "$SKIP" ] && skipped=(--skipped "$SKIP")
          node cli/scripts/contract-evidence.js leg --out "$REPORTS/result.json" --report "$REPORTS/leg.json" "${skipped[@]}" \
            --fw-tag "$FW_TAG" --fw-ref "$FW_SHA" --cli-tag "$CLI_TAG" --cli-ref "$GITHUB_SHA" \
            --cli-file "$OUT/bin/station-cli-linux-x64" --pack-tag "$PACK_TAG" --pack-ref "$PACK_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fw-contract-${{ strategy.job-index }}
          path: ${{ env.REPORTS }}
          retention-days: 14
          if-no-files-found: ignore

  report:
    needs: [targets, contract]
    if: always()
    runs-on: [self-hosted, Linux, X64]
    outputs:
      report: ${{ steps.join.outputs.report }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Harness available?
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: echo "ok=$([ -n "$RELEASE_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          path: cli
          sparse-checkout: scripts

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          repository: ${{ env.FW_REPO }}
          ref: ${{ env.HARNESS_REF }}
          path: harness
          token: ${{ secrets.RELEASE_TOKEN }}
          sparse-checkout: tests/cli_contract

      - uses: actions/download-artifact@v4
        with:
          pattern: fw-contract-*
          path: reports

      - name: Join the reports
        id: join
        run: |
          if [ -f harness/tests/cli_contract/aggregate.js ]; then
            node harness/tests/cli_contract/aggregate.js reports report.md "station-cli ↔ S1TTXX-firmware command contract" >/dev/null
          else
            echo "Firmware contract not run (RELEASE_TOKEN not set)." > report.md
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo "report<<CONTRACT_EOF"
            cat report.md
            echo "CONTRACT_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: fw-contract-report
          path: report.md
          retention-days: 30

      - name: Evidence file
        run: |
          node cli/scripts/contract-evidence.js merge --dir reports --out evidence/evidence.json \
            --suite cli_contract --suite-repo "$GITHUB_REPOSITORY" --suite-ref "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Named as release-compat downloads it (`gh run download -n compat-evidence`).
      - uses: actions/upload-artifact@v4
        with:
          name: compat-evidence
          path: evidence/evidence.json
          retention-days: 30

      # A published CLI release was tested: hand the evidence to release-compat.
      # (build.yml does this for a new release, once it is published.)
      - name: Report the evidence to release-compat
        if: github.event_name == 'workflow_dispatch' && inputs.cli_tag != '' && needs.targets.outputs.compat == 'true'
        env:
          GH_TOKEN: ${{ secrets.COMPAT_TOKEN }}
        run: |
          gh api "repos/$COMPAT_REPO/dispatches" -f event_type=compat-evidence \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" -f "client_payload[run_id]=$GITHUB_RUN_ID" \
            && echo "::notice::evidence of run $GITHUB_RUN_ID sent to $COMPAT_REPO" \
            || echo "::warning::could not notify $COMPAT_REPO (COMPAT_TOKEN needs contents:write there); re-run this job to send the evidence"

      # The run goes red when any pair failed, whichever way the legs ended.
      - name: Result
        if: needs.contract.result != 'success'
        run: |
          echo "::error::firmware contract: at least one pair failed (table above)"
          exit 1
